<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PRICE FIRST</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 80%;
    height: 80%;
    overflow: hidden;
}

/* vídeo */
video {
    width: 100%;
    height: 100%;
    object-fit: cover; /* deixa bonito tipo cinema */
}
</style>

</head>

<body>

<div class="container">

    <video autoplay muted loop playsinline>
        <source src="video.mp4" type="video/mp4">
    </video>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="PRICE FIRST Market Intelligence Dashboard"
  >

  <title>PRICE FIRST | Market Intelligence</title>

  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: #000000;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .dashboard-page {
      width: 100%;
      min-height: 100vh;
      background: #000000;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      min-height: 64px;
      padding: 0 24px;
      background: #000000;
      color: #ffffff;
      border-bottom: 1px solid rgba(65, 105, 225, 0.45);
    }

    .dashboard-brand {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ffffff;
    }

    .dashboard-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 0 18px;
      border: 1px solid #4169E1;
      border-radius: 999px;
      background: transparent;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      transition:
        background-color 160ms ease,
        color 160ms ease,
        box-shadow 160ms ease;
    }

    .dashboard-link:hover {
      background: #4169E1;
      color: #ffffff;
      box-shadow: 0 0 18px rgba(65, 105, 225, 0.45);
    }

    .dashboard-shell {
      width: 100%;
      min-height: calc(100vh - 65px);
      padding: 22px;
      background:
        radial-gradient(circle at top, rgba(65, 105, 225, 0.12), transparent 35%),
        #000000;
    }

    .dashboard-container {
      position: relative;
      width: 100%;
      height: calc(100vh - 109px);
      min-height: 700px;
      background: #050505;
      border: 1px solid rgba(65, 105, 225, 0.45);
      border-radius: 18px;
      padding: 10px;
      overflow: hidden;
      box-shadow:
        0 0 25px rgba(65, 105, 225, 0.18),
        0 0 80px rgba(65, 105, 225, 0.08),
        inset 0 0 20px rgba(255, 255, 255, 0.025);
    }

    .dashboard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      overflow: hidden;
    }

    .dashboard-loading {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .dashboard-frame {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000000;
    }

    .dashboard-fallback {
      display: none;
      width: 100%;
      min-height: 500px;
      padding: 40px 24px;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #000000;
      color: #ffffff;
    }

    .dashboard-fallback-content {
      width: 100%;
      max-width: 620px;
    }

    .dashboard-fallback h1 {
      margin: 0 0 14px;
      font-size: 28px;
      color: #ffffff;
    }

    .dashboard-fallback p {
      margin: 0 0 24px;
      color: #bdbdbd;
      font-size: 15px;
      line-height: 1.6;
    }

    .dashboard-fallback-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 24px;
      border: 1px solid #4169E1;
      border-radius: 999px;
      background: #4169E1;
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      text-decoration: none;
      transition:
        background-color 160ms ease,
        box-shadow 160ms ease;
    }

    .dashboard-fallback-button:hover {
      background: #3157c9;
      box-shadow: 0 0 22px rgba(65, 105, 225, 0.45);
    }

    @media (max-width: 768px) {
      .dashboard-header {
        padding: 0 16px;
      }

      .dashboard-brand {
        font-size: 13px;
      }

      .dashboard-link {
        min-height: 34px;
        padding: 0 14px;
        font-size: 12px;
      }

      .dashboard-shell {
        padding: 12px;
      }

      .dashboard-container {
        height: calc(100vh - 89px);
        min-height: 560px;
        border-radius: 14px;
        padding: 7px;
      }

      .dashboard-inner {
        border-radius: 10px;
      }
    }
  </style>
</head>

<body>
  <main class="dashboard-page">

    <header class="dashboard-header">
      <div class="dashboard-brand">
        PRICE FIRST
      </div>

      <a
        class="dashboard-link"
        href="https://volcorehq-my.sharepoint.com/personal/contato_volcoregroup_com/_layouts/15/Doc.aspx?sourcedoc={56c881d8-ec85-4a4c-88a2-966428eea310}&action=embedview&wdAllowInteractivity=False&Item=Chart%202&wdInConfigurator=True"
        target="_blank"
        rel="noopener noreferrer"
      >
        Abrir Dashboard
      </a>
    </header>

    <section class="dashboard-shell">
      <div class="dashboard-container">
        <div class="dashboard-inner">

          <div class="dashboard-loading">
            CARREGANDO DASHBOARD
          </div>

          <iframe
            class="dashboard-frame"
            src="https://volcorehq-my.sharepoint.com/personal/contato_volcoregroup_com/_layouts/15/Doc.aspx?sourcedoc={56c881d8-ec85-4a4c-88a2-966428eea310}&action=embedview&wdAllowInteractivity=False&Item=Chart%202&wdInConfigurator=True"
            title="PRICE FIRST Market Intelligence Dashboard"
            allowfullscreen
          ></iframe>

        </div>
      </div>
    </section>

  </main>
</body>
</html

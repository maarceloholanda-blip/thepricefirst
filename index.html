<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="PRICE FIRST Market Intelligence Dashboard"
  >

  <title>PRICE FIRST | Market Intelligence</title>

  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: #000000;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .dashboard-page {
      width: 100%;
      min-height: 100vh;
      background: #000000;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      min-height: 64px;
      padding: 0 24px;
      background: #000000;
      color: #ffffff;
      border-bottom: 1px solid #242424;
    }

    .dashboard-brand {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .dashboard-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 0 18px;
      border: 1px solid #ffffff;
      border-radius: 999px;
      background: transparent;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      transition:
        background-color 160ms ease,
        color 160ms ease;
    }

    .dashboard-link:hover {
      background: #ffffff;
      color: #000000;
    }

    .dashboard-container {
      position: relative;
      width: 100%;
      height: calc(100vh - 65px);
      min-height: 700px;
      background: #ffffff;
    }

    .dashboard-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
    }

    .dashboard-loading {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
    }

    .dashboard-frame {
      position: relative;
      z-index: 1;
    }

    .dashboard-fallback {
      display: none;
      width: 100%;
      min-height: 500px;
      padding: 40px 24px;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #000000;
      color: #ffffff;
    }

    .dashboard-fallback-content {
      width: 100%;
      max-width: 620px;
    }

    .dashboard-fallback h1 {
      margin: 0 0 14px;
      font-size: 28px;
    }

    .dashboard-fallback p {
      margin: 0 0 24px;
      color: #bdbdbd;
      font-size: 15px;
      line-height: 1.6;
    }

    .dashboard-fallback-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 24px;
      border: 1px solid #0540f2;
      border-radius: 999px;
      background: #0540f2;
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      text-decoration: none;

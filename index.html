<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PRICE FIRST</title>

<style>
html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    font-family:Arial, sans-serif;
    overflow:hidden;
    transition:0.3s;
}

/* TEMAS */
body.dark{
    background:#000;
    color:#fff;
}

body.light{
    background:#f5f5f5;
    color:#000;
}

/* HEADER */
header{
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:700;
    letter-spacing:8px;
    border-bottom:1px solid #222;
    position:relative;
}

/* BOTÃO TEMA */
button{
    position:absolute;
    right:15px;
    padding:8px 12px;
    cursor:pointer;
    border:none;
    border-radius:5px;
    font-weight:bold;
}

/* CONTAINER */
.container{
    width:100%;
    height:calc(100vh - 60px);
    display:flex;
    flex-direction:column;
}

/* TOPO */
.top{
    height:25%;
    width:100%;
}

/* SEPARAÇÃO */
.separator{
    height:2px;
    width:100%;
    background:#fff;
    box-shadow:0 0 10px rgba(255,255,255,0.6);
}

/* CALENDÁRIO */
.bottom{
    height:75%;
    width:100%;
}

iframe{
    width:100%;
    height:100%;
    border:none;
}
</style>

</head>

<body class="dark">

<header>
    PRICE FIRST

    <button onclick="toggleTheme()">Tema</button>
</header>

<div class="container">

    <!-- CRIPTO -->
    <div class="top">
        <iframe id="cryptoFrame"></iframe>
    </div>

    <div class="separator"></div>

    <!-- CALENDÁRIO -->
    <div class="bottom">
        <iframe id="calendarFrame"></iframe>
    </div>

</div>

<script>
let isDark = true;

function loadWidgets(){
    const crypto = document.getElementById("cryptoFrame");
    const calendar = document.getElementById("calendarFrame");

    if(isDark){
        crypto.src = "https://www.widgets.investing.com/crypto-currency-rates?theme=darkTheme&pairs=945629,997650,1001803,1010773,1010776";

        calendar.src = "https://sslecal2.investing.com?columns=exc_flags,exc_currency,exc_importance,exc_actual,exc_forecast,exc_previous&features=datepicker,timezone&countries=25,32,6,37,72,22,17,39,14,10,35,43,56,36,110,11,26,12,4,5&calType=week&timeZone=8&lang=1&darkTheme=1";
    } else {
        crypto.src = "https://www.widgets.investing.com/crypto-currency-rates?theme=lightTheme&pairs=945629,997650,1001803,1010773,1010776";

        calendar.src = "https://sslecal2.investing.com?columns=exc_flags,exc_currency,exc_importance,exc_actual,exc_forecast,exc_previous&features=datepicker,timezone&countries=25,32,6,37,72,22,17,39,14,10,35,43,56,36,110,11,26,12,4,5&calType=week&timeZone=8&lang=1";
    }
}

function toggleTheme(){
    isDark = !isDark;

    document.body.className = isDark ? "dark" : "light";

    loadWidgets();
}

loadWidgets();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PRICE FIRST</title>

<style>
html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    font-family:Arial, sans-serif;
    overflow:hidden;
}

/* HEADER */
header{
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:22px;
    font-weight:700;
    letter-spacing:8px;
    border-bottom:1px solid #222;
}

/* ÁREA TOTAL */
.container{
    width:100%;
    height:calc(100vh - 60px);
    display:flex;
    flex-direction:column;
}

/* TOPO (CRIPTO WIDGET) */
.top-widget{
    height:25%;
    width:100%;
    background:#000;
    border-bottom:1px solid #222;
}

/* RESTO (CALENDÁRIO) */
.bottom{
    height:75%;
    width:100%;
}

/* IFRAME PADRÃO */
iframe{
    width:100%;
    height:100%;
    border:none;
}

/* poweredBy opcional */
.poweredBy{
    display:none;
}
</style>

</head>

<body>

<header>PRICE FIRST</header>

<div class="container">

    <!-- 🔥 TOPO: CRIPTO -->
    <div class="top-widget">
        <iframe 
            src="https://www.widgets.investing.com/crypto-currency-rates?theme=darkTheme&pairs=945629,997650,1001803,1010773,1010776">
        </iframe>

        <div class="poweredBy">
            Powered by 
            <a href="https://www.investing.com" target="_blank" rel="nofollow">
                Investing.com
            </a>
        </div>
    </div>

    <!-- 📊 ABAIXO: CALENDÁRIO ECONÔMICO -->
    <div class="bottom">
        <iframe
            src="https://sslecal2.investing.com?columns=exc_flags,exc_currency,exc_importance,exc_actual,exc_forecast,exc_previous&features=datepicker,timezone&countries=25,32,6,37,72,22,17,39,14,10,35,43,56,36,110,11,26,12,4,5&calType=week&timeZone=8&lang=1">
        </iframe>
    </div>

</div>

</body>
</html>

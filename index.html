<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PRICE FIRST</title>

<style>
html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    font-family:Arial, sans-serif;
    overflow:hidden;
}

/* HEADER */
header{
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:22px;
    font-weight:700;
    letter-spacing:8px;
    border-bottom:1px solid #222;
    text-transform:uppercase;
}

/* LAYOUT */
.container{
    width:100%;
    height:calc(100vh - 60px);
    display:flex;
    flex-direction:column;
}

/* TOPO CRIPTO */
.top{
    height:25%;
    width:100%;
    background:#000;
}

/* LINHA DE SEPARAÇÃO */
.separator{
    height:2px;
    width:100%;
    background:#ffffff;
    box-shadow:0 0 10px rgba(255,255,255,0.6);
}

/* CALENDÁRIO */
.bottom{
    height:75%;
    width:100%;
}

/* IFAME PADRÃO */
iframe{
    width:100%;
    height:100%;
    border:none;
}

/* powered by oculto */
.poweredBy{
    display:none;
}
</style>

</head>

<body>

<header>PRICE FIRST</header>

<div class="container">

    <!-- 🔥 CRIPTO (DARK THEME) -->
    <div class="top">
        <iframe
            src="https://www.widgets.investing.com/crypto-currency-rates?theme=darkTheme&pairs=945629,997650,1001803,1010773,1010776">
        </iframe>
    </div>

    <!-- LINHA DE SEPARAÇÃO -->
    <div class="separator"></div>

    <!-- 📊 CALENDÁRIO (DARK MODE) -->
    <div class="bottom">
        <iframe
            src="https://sslecal2.investing.com?columns=exc_flags,exc_currency,exc_importance,exc_actual,exc_forecast,exc_previous&features=datepicker,timezone&countries=25,32,6,37,72,22,17,39,14,10,35,43,56,36,110,11,26,12,4,5&calType=week&timeZone=8&lang=1&darkTheme=1">
        </iframe>
    </div>

</div>

</body>
</html>

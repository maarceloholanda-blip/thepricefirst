<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Price First</title>

<style>
html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000000;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

header{
    height:60px;
    line-height:60px;
    text-align:center;
    color:white;
    background:#000000;
    border-bottom:1px solid #222;
    letter-spacing:3px;
    font-size:18px;
}

#tradingview_chart{
    width:100%;
    height:calc(100vh - 60px);
}
</style>

</head>

<body>

<header>THE PRICE FIRST</header>

<div id="tradingview_chart"></div>

<script src="https://s3.tradingview.com/tv.js"></script>

<script>
new TradingView.widget({

    container_id: "tradingview_chart",

    autosize: true,

    symbol: "NASDAQ:AAPL",

    interval: "D",

    timezone: "Etc/UTC",

    theme: "dark",

    style: "1",

    locale: "en",

    toolbar_bg: "#000000",

    backgroundColor: "#000000",

    allow_symbol_change: true,

    hide_top_toolbar: false,

    hide_legend: false,

    save_image: true,

    withdateranges: true,

    details: true,

    hotlist: true,

    calendar: true,

    studies: [],

    width: "100%",

    height: "100%"
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title> THE PRICE FIRST</title>

<style>
html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

header{
    height:50px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    color:#fff;
    font-size:18px;
    font-weight:bold;
    letter-spacing:4px;
    border-bottom:1px solid #111;
}

#tradingview_chart{
    width:100%;
    height:calc(100vh - 50px);
}
</style>

<script src="https://s3.tradingview.com/tv.js"></script>
</head>

<body>

<header>PRICE FIRST</header>

<div id="tradingview_chart"></div>

<script>
new TradingView.widget({
    container_id: "tradingview_chart",
    autosize: true,
    symbol: "NASDAQ:AAPL",
    interval: "D",
    timezone: "Etc/UTC",
    theme: "dark",
    style: "1",
    locale: "pt",

    backgroundColor: "#000000",

    allow_symbol_change: false,
    hide_top_toolbar: true,
    hide_legend: true,
    withdateranges: false,
    details: false,
    hotlist: false,
    calendar: false,
    studies: []
});
</script>

</body>
</html>

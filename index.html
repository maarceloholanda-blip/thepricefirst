<!DOCTYPE html>
<html>
<head>
  <title>The Price First</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background-color: #0d0d0d;
      color: white;
    }

    header {
      text-align: center;
      padding: 10px;
      background: #111;
      font-size: 22px;
      border-bottom: 1px solid #333;
    }

    .ticker {
      background: black;
      padding: 5px;
    }

    .content {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .chart-box {
      background: #111;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }

    button {
      padding: 8px 12px;
      background: #222;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 5px;
    }

    button:hover {
      background: #444;
    }

    .calendar {
      background: #111;
      padding: 15px;
      border-radius: 10px;
    }

  </style>

  <script src="https://s3.tradingview.com/tv.js"></script>

</head>

<body>

<header>THE PRICE FIRST 🚀</header>

<!-- ✅ TICKER -->
<div class="ticker">
  <div class="tradingview-widget-container">
    <script src="https://s3.tradingview.com/tv.js">
    {
      "symbols": [
        {"proName":"SP:SPX","title":"S&P 500"},
        {"proName":"NASDAQ:NVDA"},
        {"proName":"NASDAQ:AAPL"},
        {"proName":"NASDAQ:MSFT"},
        {"proName":"NASDAQ:TSLA"},
        {"proName":"AMEX:SPY"}
      ],
      "colorTheme": "dark",
      "displayMode": "adaptive"
    }
    </script>
  </div>
</div>

<div class="content">

  <!-- ✅ GRÁFICO -->
  <div class="chart-box">

    <h3>Gráfico</h3>

    <!-- BOTÕES -->
    <div class="buttons">
      <button onclick="loadChart('AMEX:SPY')">SPY</button>
      <button onclick="loadChart('NASDAQ:NVDA')">NVDA</button>
      <button onclick="loadChart('NASDAQ:AAPL')">AAPL</button>
      <button onclick="loadChart('NASDAQ:TSLA')">TSLA</button>
      <button onclick="loadChart('NASDAQ:MSFT')">MSFT</button>
      <button onclick="loadChart('BINANCE:BTCUSDT')">BTC</button>
      <button onclick="loadChart('BINANCE:ETHUSDT')">ETH</button>
    </div>

    <div id="main_chart"></div>

  </div>

  <!-- ✅ CALENDÁRIO -->
  <div class="calendar">
    <h3>Calendário Econômico</h3>

    <div class="tradingview-widget-container">
      <script src="https://s3.tradingview.com/external-embedding/embed-widget-events.js">
      {
        "width": "100%",
        "height": "500"
      }
      </script>
    </div>
  </div>

</div>

<script>

// carregar gráfico inicial
let currentChart;

function loadChart(symbol) {
  document.getElementById("main_chart").innerHTML = "";

  currentChart = new TradingView.widget({
    "container_id": "main_chart",
    "symbol": symbol,
    "interval": "60",
    "width": "100%",
    "height": 600
  });
}

// gráfico inicial (SPY)
loadChart("AMEX:SPY");

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PRICE FIRST</title>

<style>
html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    font-family:Arial;
    overflow:hidden;
}

/* HEADER */
header{
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:22px;
    font-weight:700;
    letter-spacing:8px;
    border-bottom:1px solid #222;
}

/* LAYOUT PRINCIPAL */
.container{
    display:flex;
    width:100%;
    height:calc(100vh - 60px);
}

/* BARRA LATERAL ESQUERDA */
.sidebar{
    width:15%;
    background:#0a0a0a;
    border-right:1px solid #222;
}

/* ÁREA CENTRAL (CALENDÁRIO) */
.main{
    width:70%;
    background:#000;
}

/* BARRA DIREITA (opcional) */
.rightbar{
    width:15%;
    background:#0a0a0a;
    border-left:1px solid #222;
}

/* IFRAME */
iframe{
    width:100%;
    height:100%;
    border:none;
}

/* remove scroll */
::-webkit-scrollbar{
    display:none;
}
</style>

</head>

<body>

<header>PRICE FIRST</header>

<div class="container">

    <div class="sidebar">
        <!-- você pode colocar menus aqui -->
    </div>

    <div class="main">
        <iframe
            src="https://sslecal2.investing.com?columns=exc_flags,exc_currency,exc_importance,exc_actual,exc_forecast,exc_previous&features=datepicker,timezone&countries=25,32,6,37,72,22,17,39,14,10,35,43,56,36,110,11,26,12,4,5&calType=week&timeZone=8&lang=1">
        </iframe>
    </div>

    <div class="rightbar">
        <!-- espaço futuro -->
    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>The Price First</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background-color: #0d0d0d;
      color: white;
    }

    header {
      text-align: center;
      padding: 10px;
      background: #111;
      font-size: 22px;
      border-bottom: 1px solid #333;
      letter-spacing: 2px;
    }

    .ticker {
      background: black;
      padding: 5px;
    }

    .content {
      max-width: 1600px;
      margin: auto;
      padding: 30px;
    }

    .chart-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .main-chart {
      background: #111;
      padding: 10px;
      border-radius: 10px;
    }

    .small-charts {
      display: flex;
      gap: 10px;
    }

    .small-chart {
      flex: 1;
      background: #111;
      padding: 10px;
      border-radius: 10px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }

    button {
      padding: 8px 12px;
      background: #222;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 5px;
    }

    button:hover {
      background: #444;
    }

    .calendar {
      background: #111;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
    }

  </style>

  <script src="https://s3.tradingview.com/tv.js"></script>

</head>

<body>

<header>THE PRICE FIRST</header>

<!-- ✅ TICKER -->
<div class="ticker">
  <div class="tradingview-widget-container">
  </div>
</div>

<div class="content">

  <div class="chart-container">

    <!-- BOTÕES -->
    <div class="buttons">
      <button onclick="loadCharts('AMEX:SPY')">SPY</button>
      <button onclick="loadCharts('NASDAQ:NVDA')">NVDA</button>
      <button onclick="loadCharts('NASDAQ:AAPL')">AAPL</button>
      <button onclick="loadCharts('NASDAQ:TSLA')">TSLA</button>
      <button onclick="loadCharts('NASDAQ:MSFT')">MSFT</button>
      <button onclick="loadCharts('BINANCE:BTCUSDT')">BTC</button>
    </div>

    <!-- ✅ GRÁFICO PRINCIPAL (DIÁRIO) -->
    <div class="main-chart">
      <div id="chart_daily"></div>
    </div>

    <!-- ✅ GRÁFICOS MENORES -->
    <div class="small-charts">

      <!-- SEMANAL -->
      <div class="small-chart">
        <div id="chart_weekly"></div>
      </div>

      <!-- MENSAL -->
      <div class="small-chart">
        <div id="chart_monthly"></div>
      </div>

    </div>

  </div>

  <!-- ✅ CALENDÁRIO -->
  <div class="calendar">
    <h3>Calendário Econômico</h3>

    <div class="tradingview-widget-container">
      <script src="https://s3.tradingview.com/external-embedding/embed-widget-events.js">
      {
        "width": "100%",
        "height": "500"
      }
      </script>
    </div>
  </div>

</div>

<script>

function loadCharts(symbol) {

  document.getElementById("chart_daily").innerHTML = "";
  document.getElementById("chart_weekly").innerHTML = "";
  document.getElementById("chart_monthly").innerHTML = "";

  // Diário (principal)
  new TradingView.widget({
    "container_id": "chart_daily",
    "symbol": symbol,
    "interval": "D",
    "width": "100%",
    "height": 500
  });

  // Semanal
  new TradingView.widget({
    "container_id": "chart_weekly",
    "symbol": symbol,
    "interval": "W",
    "width": "100%",
    "height": 300
  });

  // Mensal
  new TradingView.widget({
    "container_id": "chart_monthly",
    "symbol": symbol,
    "interval": "M",
    "width": "100%",
    "height": 300
  });
}

// inicial
loadCharts("AMEX:SPY");

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>The Price First</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background-color: #0d0d0d;
      color: white;
    }

    header {
      text-align: center;
      padding: 12px;
      background: #111;
      font-size: 20px;
      border-bottom: 1px solid #333;
      letter-spacing: 3px;
    }

    /* ✅ TICKER */
    .ticker {
      background: #000;
    }

    /* ✅ CONTAINER PRINCIPAL */
    .content {
      max-width: 1700px;
      width: 95%;
      margin: auto;
      padding: 20px;
    }

    /* ✅ GRÁFICO GRANDE */
    .main-chart {
      background: #111;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    /* ✅ GRÁFICOS MENORES */
    .small-charts {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
    }

    .small-chart {
      flex: 1;
      background: #111;
      padding: 15px;
      border-radius: 12px;
    }

    /* ✅ BOTÕES */
    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    button {
      padding: 8px 14px;
      background: #222;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 6px;
      font-size: 12px;
    }

    button:hover {
      background: #444;
    }

    /* ✅ CALENDÁRIO */
    .calendar {
      background: #111;
      padding: 20px;
      border-radius: 12px;
    }

  </style>

</head>

<body>

<header>THE PRICE FIRST</header>

<!-- ✅ TICKER REAL -->
<div class="ticker">
  <iframe 
    src="https://s.tradingview.com/widgetembed/?frameElementId=tradingview_ticker&symbol=SPX&interval=1D&hidesidetoolbar=1"
    style="width:100%; height:50px; border:none;">
  </iframe>
</div>

<div class="content">

  <!-- BOTÕES -->
  <div class="buttons">
    <button onclick="loadCharts('AMEX:SPY')">SPY</button>
    <button onclick="loadCharts('NASDAQ:NVDA')">NVDA</button>
    <button onclick="loadCharts('NASDAQ:AAPL')">AAPL</button>
    <button onclick="loadCharts('NASDAQ:MSFT')">MSFT</button>
    <button onclick="loadCharts('NASDAQ:TSLA')">TSLA</button>
    <button onclick="loadCharts('BINANCE:BTCUSDT')">BTC</button>
  </div>

  <!-- ✅ GRÁFICO PRINCIPAL (DIÁRIO) -->
  <div class="main-chart">
    <div id="chart_daily"></div>
  </div>

  <!-- ✅ GRÁFICOS SECUNDÁRIOS -->
  <div class="small-charts">

    <div class="small-chart">
      <div id="chart_weekly"></div>
    </div>

    <div class="small-chart">
      <div id="chart_monthly"></div>
    </div>

  </div>

  <!-- ✅ CALENDÁRIO -->
  <div class="calendar">
    <h3>Calendário Econômico</h3>

    <iframe src="https://s.tradingview.com/widgetembed/?frameElementId=calendar"
      style="width:100%; height:500px; border:none;">
    </iframe>
  </div>

</div>

<script src="https://s3.tradingview.com/tv.js"></script>

<script>

function loadCharts(symbol) {

  document.getElementById("chart_daily").innerHTML = "";
  document.getElementById("chart_weekly").innerHTML = "";
  document.getElementById("chart_monthly").innerHTML = "";

  // ✅ DIÁRIO (principal)
  new TradingView.widget({
    "container_id": "chart_daily",
    "symbol": symbol,
    "interval": "D",
    "width": "100%",
    "height": 700
  });

  // ✅ SEMANAL
  new TradingView.widget({
    "container_id": "chart_weekly",
    "symbol": symbol,
    "interval": "W",
    "width": "100%",
    "height": 350
  });

  // ✅ MENSAL
  new TradingView.widget({
    "container_id": "chart_monthly",
    "symbol": symbol,
    "interval": "M",
    "width": "100%",
    "height": 350
  });
}

// inicial
loadCharts("AMEX:SPY");

</script>

</body>
</html>

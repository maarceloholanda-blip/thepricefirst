<!DOCTYPE html>
<html>
<head>
  <title>The Price First</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background-color: #0d0d0d;
      color: white;
    }

    header {
      text-align: center;
      padding: 10px;
      background: #111;
      font-size: 22px;
      border-bottom: 1px solid #333;
    }

    .ticker {
      background: black;
      padding: 5px;
    }

    .container {
      display: grid;
      grid-template-columns: 200px 1fr 300px;
      grid-template-rows: auto auto;
      gap: 10px;
      padding: 10px;
    }

    .sidebar, .chart, .calendar, .heatmap {
      background: #111;
      border-radius: 8px;
      padding: 10px;
    }

    .calendar {
      grid-column: 1 / span 3;
    }

    .heatmap {
      grid-column: 1 / span 3;
    }

    button {
      width: 100%;
      padding: 8px;
      margin-bottom: 5px;
      background: #222;
      border: none;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }
  </style>

  <!-- TradingView script -->
  <script src="https://s3.tradingview.com/tv.js"></script>

</head>

<body>

<!-- HEADER -->
<header>THE PRICE FIRST 🚀</header>

<!-- ✅ TICKER (ATIVOS PASSANDO NO TOPO) -->
<div class="ticker">
  <div class="tradingview-widget-container">
    <div id="ticker_tape"></div>
    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js">
    {
      "symbols": [
        {"proName":"SP:SPX","title":"S&P 500"},
        {"proName":"NASDAQ:NVDA"},
        {"proName":"NASDAQ:AAPL"},
        {"proName":"NASDAQ:MSFT"},
        {"proName":"NASDAQ:TSLA"},
        {"proName":"AMEX:SPY"},
        {"proName":"BINANCE:BTCUSDT"},
        {"proName":"BINANCE:ETHUSDT"}
      ],
      "showSymbolLogo": true,
      "colorTheme": "dark",
      "isTransparent": false,
      "displayMode": "adaptive"
    }
    </script>
  </div>
</div>

<div class="container">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h3>Ativos</h3>

    <button onclick="loadChart('AMEX:SPY')">SPY</button>
    <button onclick="loadChart('NASDAQ:NVDA')">NVDA</button>
    <button onclick="loadChart('NASDAQ:TSLA')">TSLA</button>
    <button onclick="loadChart('NASDAQ:AAPL')">AAPL</button>
    <button onclick="loadChart('NASDAQ:MSFT')">MSFT</button>
    <button onclick="loadChart('BINANCE:BTCUSDT')">BTC</button>
    <button onclick="loadChart('BINANCE:ETHUSDT')">ETH</button>
  </div>

  <!-- GRÁFICO PRINCIPAL -->
  <div class="chart">
    <div id="main_chart"></div>
  </div>

  <!-- GRÁFICO SECUNDÁRIO -->
  <div class="chart">
    <div id="second_chart"></div>
  </div>

  <!-- ✅ HEATMAP S&P500 -->
  <div class="heatmap">
    <h3>Heatmap S&P 500</h3>

    <div class="tradingview-widget-container">
      <div id="heatmap_widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js">
      {
        "dataSource": "SPX500",
        "grouping": "sector",
        "blockSize": "market_cap_basic",
        "blockColor": "change",
        "locale": "en",
        "symbolUrl": "",
        "colorTheme": "dark",
        "hasTopBar": true,
        "isDataSetEnabled": true,
        "isZoomEnabled": true,
        "hasSymbolTooltip": true,
        "width": "100%",
        "height": "500"
      }
      </script>
    </div>

  </div>

  <!-- CALENDÁRIO -->
  <div class="calendar">
    <h3>Calendário Econômico</h3>

    <div class="tradingview-widget-container">
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-events.js">
      {
        "width": "100%",
        "height": "500",
        "importanceFilter": "-1,0,1"
      }
      </script>
    </div>
  </div>

</div>

<script>

let mainChart;
let secondChart;

// gráfico principal
mainChart = new TradingView.widget({
  "container_id": "main_chart",
  "symbol": "AMEX:SPY",
  "interval": "60",
  "width": "100%",
  "height": 500
});

// gráfico secundário
secondChart = new TradingView.widget({
  "container_id": "second_chart",
  "symbol": "BINANCE:BTCUSDT",
  "interval": "60",
  "width": "100%",
  "height": 500
});

// troca ativo
function loadChart(symbol) {
  document.getElementById("main_chart").innerHTML = "";

  new TradingView.widget({
    "container_id": "main_chart",
    "symbol": symbol,
    "interval": "60",
    "width": "100%",
    "height": 500
  });
}

</script>

</body>
</html>

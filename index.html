<!DOCTYPE html>
<html>
<head>
  <title>The Price First</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      color: black;
    }

    header {
      text-align: center;
      padding: 15px;
      font-size: 18px;
      letter-spacing: 3px;
      background: white;
      border-bottom: 1px solid #ddd;
    }

    .ticker {
      background: white;
      border-bottom: 1px solid #ddd;
      padding: 5px 0;
    }

    .container {
      max-width: 1700px;
      width: 95%;
      margin: auto;
      padding: 20px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 15px;
    }

    button {
      padding: 8px 14px;
      border: 1px solid #ccc;
      background: white;
      cursor: pointer;
      border-radius: 6px;
    }

    button:hover {
      background: #eee;
    }

    .main-chart {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .small-charts {
      display: flex;
      gap: 15px;
    }

    .small-chart {
      flex: 1;
      background: white;
      padding: 15px;
      border-radius: 12px;
    }

  </style>

  <!-- TradingView script -->
  <script src="https://s3.tradingview.com/tv.js"></script>

</head>

<body>

<header>THE PRICE FIRST</header>

<!-- ✅ TICKER REAL FUNCIONANDO -->
<div class="ticker">
  <div class="tradingview-widget-container">
    <div id="ticker_tape"></div>
  </div>
</div>

<div class="container">

  <!-- BOTÕES -->
  <div class="buttons">
    <button onclick="loadCharts('AMEX:SPY')">SPY</button>
    <button onclick="loadCharts('NASDAQ:NVDA')">NVDA</button>
    <button onclick="loadCharts('NASDAQ:AAPL')">AAPL</button>
    <button onclick="loadCharts('NASDAQ:MSFT')">MSFT</button>
    <button onclick="loadCharts('NASDAQ:TSLA')">TSLA</button>
    <button onclick="loadCharts('BINANCE:BTCUSDT')">BTC</button>
  </div>

  <!-- ✅ GRÁFICO PRINCIPAL -->
  <div class="main-chart">
    <div id="chart_daily"></div>
  </div>

  <!-- ✅ GRÁFICOS MENORES -->
  <div class="small-charts">
    <div class="small-chart">
      <div id="chart_weekly"></div>
    </div>

    <div class="small-chart">
      <div id="chart_monthly"></div>
    </div>
  </div>

</div>

<script>

// ✅ TICKER TOPO (correto)
new TradingView.widget({
  "container_id": "ticker_tape",
  "symbols": [
    {"proName":"SP:SPX","title":"S&P 500"},
    {"proName":"AMEX:SPY"},
    {"proName":"NASDAQ:NVDA"},
    {"proName":"NASDAQ:AAPL"},
    {"proName":"NASDAQ:MSFT"},
    {"proName":"NASDAQ:TSLA"},
    {"proName":"BINANCE:BTCUSDT"},
    {"proName":"BINANCE:ETHUSDT"}
  ],
  "colorTheme": "light",
  "displayMode": "adaptive"
});


// ✅ FUNÇÃO DOS GRÁFICOS
function loadCharts(symbol) {

  document.getElementById("chart_daily").innerHTML = "";
  document.getElementById("chart_weekly").innerHTML = "";
  document.getElementById("chart_monthly").innerHTML = "";

  // ✅ DIÁRIO (MAIOR + LIMPO)
  new TradingView.widget({
    container_id: "chart_daily",
    symbol: symbol,
    interval: "D",
    width: "100%",
    height: 900,
    hide_side_toolbar: true,
    hide_top_toolbar: true,
    studies: []
  });

  // ✅ SEMANAL
  new TradingView.widget({
    container_id: "chart_weekly",
    symbol: symbol,
    interval: "W",
    width: "100%",
    height: 320,
    hide_side_toolbar: true,
    hide_top_toolbar: true,
    studies: []
  });

  // ✅ MENSAL
  new TradingView.widget({
    container_id: "chart_monthly",
    symbol: symbol,
    interval: "M",
    width: "100%",
    height: 320,
    hide_side_toolbar: true,
    hide_top_toolbar: true,
    studies: []
  });
}

// ✅ INICIAL
loadCharts("AMEX:SPY");

</script>

</body>
</html>

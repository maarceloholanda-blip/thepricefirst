<!DOCTYPE html>
<html>
<head>
  <title>The Price First</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background-color: #0d0d0d;
      color: white;
    }

    header {
      text-align: center;
      padding: 15px;
      background: #111;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 1px solid #333;
    }

    .container {
      display: grid;
      grid-template-columns: 200px 1fr 300px;
      grid-template-rows: auto auto;
      gap: 10px;
      padding: 10px;
    }

    .sidebar {
      background: #111;
      padding: 10px;
      border-radius: 8px;
    }

    .chart {
      background: #111;
      border-radius: 8px;
      padding: 5px;
    }

    .calendar {
      grid-column: 1 / span 3;
      background: #111;
      padding: 10px;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 8px;
      margin-bottom: 5px;
      background: #222;
      border: none;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }
  </style>

  <script src="https://s3.tradingview.com/tv.js"></script>

</head>

<body>

<header>THE PRICE FIRST 🚀</header>

<div class="container">

  <!-- LISTA DE ATIVOS -->
  <div class="sidebar">
    <h3>Ativos</h3>

    <button onclick="loadChart('AMEX:SPY')">SPY</button>
    <button onclick="loadChart('NASDAQ:NVDA')">NVDA</button>
    <button onclick="loadChart('NASDAQ:TSLA')">TSLA</button>
    <button onclick="loadChart('NASDAQ:AAPL')">AAPL</button>
    <button onclick="loadChart('NASDAQ:MSFT')">MSFT</button>
    <button onclick="loadChart('BINANCE:BTCUSDT')">BTC</button>
    <button onclick="loadChart('BINANCE:ETHUSDT')">ETH</button>

  </div>

  <!-- GRÁFICO PRINCIPAL -->
  <div class="chart">
    <div id="main_chart"></div>
  </div>

  <!-- GRÁFICO SECUNDÁRIO -->
  <div class="chart">
    <div id="second_chart"></div>
  </div>

  <!-- CALENDÁRIO -->
  <div class="calendar">
    <h3>Calendário Econômico</h3>

    <div class="tradingview-widget-container">
      <div id="economic_calendar"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-events.js">
      {
        "width": "100%",
        "height": "500",
        "importanceFilter": "-1,0,1"
      }
      </script>
    </div>

  </div>

</div>

<script>

let mainChart;
let secondChart;

// gráfico principal
mainChart = new TradingView.widget({
  "container_id": "main_chart",
  "symbol": "AMEX:SPY",
  "interval": "60",
  "width": "100%",
  "height": 500
});

// gráfico secundário fixo (BTC)
secondChart = new TradingView.widget({
  "container_id": "second_chart",
  "symbol": "BINANCE:BTCUSDT",
  "interval": "60",
  "width": "100%",
  "height": 500
});

// função para trocar ativo
function loadChart(symbol) {
  document.getElementById("main_chart").innerHTML = "";

  new TradingView.widget({
    "container_id": "main_chart",
    "symbol": symbol,
    "interval": "60",
    "width": "100%",
    "height": 500
  });
}

</script>

</body>
</html>


<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PRICE FIRST</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

/* CARD PRINCIPAL */
.card {
    width: 420px;
    height: 320px;
    background: #111;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(0,0,0,0.6);
    transition: 0.3s;
    cursor: pointer;
}

.card:hover {
    transform: scale(1.03);
    box-shadow: 0 0 40px rgba(65,105,225,0.4); /* azul Volcore */
}

/* IMAGEM */
.card img {
    width: 100%;
    height: 70%;
    object-fit: cover;
}

/* CONTEÚDO */
.content {
    padding: 15px;
    color: #fff;
}

.title {
    font-size: 16px;
    font-weight: bold;
}

.subtitle {
    font-size: 12px;
    color: #aaa;
    margin-top: 5px;
}

/* BADGE */
.badge {
    margin-top: 10px;
    display: inline-block;
    background: #4169E1;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11px;
}
</style>

</head>

<body>

<div class="card" onclick="abrirProjeto()">

    <img src="https://via.placeholder.com/500x300.png?text=Volcore+Preview">

    <div class="content">
        <div class="title">Top 90 Scanner</div>
        <div class="subtitle">Liquidity • ATR • Institutional Filter</div>
        <div class="badge">LIVE SYSTEM</div>
    </div>

</div>

<script>
function abrirProjeto(){
    window.open("https://SEU-LINK-AQUI.com", "_blank");
}
</script>

</body>
</html>

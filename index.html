<!DOCTYPE html>
<html>
<head>
  <title>The Price First</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background-color: #0d0d0d;
      color: white;
    }

    header {
      text-align: center;
      padding: 10px;
      background: #111;
      font-size: 22px;
      border-bottom: 1px solid #333;
    }

    .ticker {
      background: black;
      padding: 5px;
    }

    .main {
      display: flex;
      justify-content: center;
      margin-top: 20px;
      gap: 20px;
    }

    .chart-box {
      width: 800px;
      background: #111;
      padding: 10px;
      border-radius: 10px;
    }

    .side-box {
      width: 300px;
      background: #111;
      padding: 10px;
      border-radius: 10px;
    }

    .calendar {
      max-width: 1100px;
      margin: 20px auto;
      background: #111;
      padding: 10px;
      border-radius: 10px;
    }

  </style>

  <script src="https://s3.tradingview.com/tv.js"></script>

</head>

<body>

<header>THE PRICE FIRST 🚀</header>

<!-- ✅ TICKER -->
<div class="ticker">
  <div class="tradingview-widget-container">
    <script src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js">
    {
      "symbols": [
        {"proName":"SP:SPX","title":"S&P 500"},
        {"proName":"NASDAQ:NVDA"},
        {"proName":"NASDAQ:AAPL"},
        {"proName":"NASDAQ:MSFT"},
        {"proName":"NASDAQ:TSLA"},
        {"proName":"AMEX:SPY"}
      ],
      "colorTheme": "dark",
      "isTransparent": false,
      "displayMode": "adaptive"
    }
    </script>
  </div>
</div>

<!-- ✅ CONTEÚDO CENTRAL -->
<div class="main">

  <!-- GRÁFICO -->
  <div class="chart-box">
    <h3>Gráfico</h3>
    <div id="main_chart"></div>
  </div>

  <!-- ✅ LISTA TREASURIES -->
  <div class="side-box">
    <h3>US Treasuries</h3>

    <div class="tradingview-widget-container">
      <script src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js">
      {
        "colorTheme": "dark",
        "dateRange": "1D",
        "showChart": false,
        "locale": "en",
        "width": "100%",
        "height": "400",
        "tabs": [
          {
            "title": "Bonds",
            "symbols": [
              {"s":"TVC:US02Y","d":"2Y"},
              {"s":"TVC:US05Y","d":"5Y"},
              {"s":"TVC:US10Y","d":"10Y"},
              {"s":"TVC:US30Y","d":"30Y"}
            ]
          }
        ]
      }
      </script>
    </div>

  </div>

</div>

<!-- ✅ CALENDÁRIO -->
<div class="calendar">
  <h3>Calendário Econômico</h3>

  <div class="tradingview-widget-container">
    <script src="https://s3.tradingview.com/external-embedding/embed-widget-events.js">
    {
      "width": "100%",
      "height": "450"
    }
    </script>
  </div>
</div>

<script>

// gráfico principal
new TradingView.widget({
  "container_id": "main_chart",
  "symbol": "AMEX:SPY",
  "interval": "60",
  "width": "100%",
  "height": 500
});

</script>

</body>
</html>

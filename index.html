<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PRICE FIRST</title>

<style>
html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
}

/* TOPO */
header{
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    color:#fff;
    font-size:22px;
    font-weight:700;
    letter-spacing:8px;
    text-transform:uppercase;
    border-bottom:1px solid #222;
}

/* CALENDÁRIO OCUPA QUASE TELA TODA */
#economic-calendar{
    width:100%;
    height:calc(100vh - 60px);
    background:#000;
    overflow:hidden;
}

#economic-calendar iframe{
    width:100%;
    height:100%;
    border:none;
}

/* esconder scrollbar */
::-webkit-scrollbar{
    width:0;
    height:0;
}
</style>

</head>

<body>

<header>PRICE FIRST</header>

<div id="economic-calendar">
    <iframe
        src="https://sslecal2.investing.com?columns=exc_flags,exc_currency,exc_importance,exc_actual,exc_forecast,exc_previous&features=datepicker,timezone&countries=25,32,6,37,72,22,17,39,14,10,35,43,56,36,110,11,26,12,4,5&calType=week&timeZone=8&lang=1"
        allowtransparency="true"
        marginwidth="0"
        marginheight="0">
    </iframe>
</div>

</body>
</html>

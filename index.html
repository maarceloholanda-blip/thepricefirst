<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PRICE FIRST</title>

<style>
html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:Arial, sans-serif;
}

header{
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    color:#fff;
    font-size:22px;
    font-weight:700;
    letter-spacing:6px;
    border-bottom:1px solid #111;
}

#tradingview_chart{
    width:100%;
    height:65vh;
}

#economic-calendar{
    width:100%;
    height:calc(35vh - 60px);
    background:#000;
    overflow:hidden;
}

#economic-calendar iframe{
    width:100%;
    height:100%;
    border:none;
}

.poweredBy{
    display:none;
}
</style>

<script src="https://s3.tradingview.com/tv.js"></script>
</head>

<body>

<header>PRICE FIRST</header>

<div id="tradingview_chart"></div>

<div id="economic-calendar">
    <iframe
        src="https://sslecal2.investing.com?columns=exc_flags,exc_currency,exc_importance,exc_actual,exc_forecast,exc_previous&features=datepicker,timezone&countries=25,32,6,37,72,22,17,39,14,10,35,43,56,36,110,11,26,12,4,5&calType=week&timeZone=8&lang=1"
        allowtransparency="true"
        marginwidth="0"
        marginheight="0">
    </iframe>
</div>

<script>
new TradingView.widget({
    container_id: "tradingview_chart",
    autosize: true,
    symbol: "NASDAQ:AAPL",
    interval: "D",
    timezone: "Etc/UTC",
    theme: "dark",
    style: "1",
    locale: "pt",

    backgroundColor: "#000000",

    allow_symbol_change: false,
    hide_top_toolbar: true,
    hide_legend: true,
    withdateranges: false,
    details: false,
    hotlist: false,
    calendar: false,
    studies: []
});
</script>

</body>
</html>
